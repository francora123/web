<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERR_CONNECTION_REFUSED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; user-select: none;
            touch-action: none; /* Bloquea gestos de recargar en móvil */
            word-wrap: break-word; /* Evita que el texto se salga de la pantalla */
        }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #terminal {
            position: relative; padding: 1.5rem; height: 100%;
            box-sizing: border-box; z-index: 1; font-size: 13px;
            line-height: 1.5; text-shadow: 0 0 5px #0f0; overflow-y: hidden;
        }

        .line { margin-bottom: 6px; }
        .sys { color: #888; }
        .ok { color: #0f0; }
        .warn { color: #ff0; text-shadow: 0 0 5px #ff0; }
        .err { color: #f00; text-shadow: 0 0 5px #f00; }
        .prompt { color: #fff; text-shadow: 0 0 8px #fff; font-weight: bold; }
        
        .cursor { display: inline-block; width: 8px; height: 14px; background: #0f0; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Pantallazo Rojo 100% adaptado a móvil */
        #crash-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #d40000; color: #fff; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; text-shadow: 2px 2px 0 #000; padding: 20px; box-sizing: border-box;
        }
        #crash-screen h1 { 
            font-size: 10vw; /* Se ajusta al ancho de la pantalla */
            margin: 0; letter-spacing: 2px; line-height: 1.1; 
        }
        #crash-screen p { 
            font-size: 4.5vw; margin-top: 15px; opacity: 0.9;
        }

        .shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body class="crt">

    <div id="terminal"></div>

    <div id="crash-screen">
        <h1>ACCESS DENIED</h1>
        <p>FATAL EXCEPTION // HOST DISCONNECTED</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>';
        
        const logs = [
            { type: 'sys', text: 'INIT: Bootstrapping host environment...' },
            { type: 'ok',  text: 'VFS_ALLOC: Local physical volumes mounted. (100%)' },
            { type: 'ok',  text: 'AUTH: Privileges escalated. Token -> [PERMANENT_RESIDENCY].' },
            { type: 'warn',text: 'SYS_TICK: Session TTL threshold reached (720h).' },
            { type: 'warn',text: 'NET_ROUTE: Traffic rerouted to untrusted external peer.' },
            { type: 'err', text: 'SEC_ALARM: SQL Injection detected in [trusted_nodes.db].' },
            { type: 'err', text: 'KERNEL_PANIC: Core failed. Dependencies missing in empath.so.' }
        ];

        const purgeFiles = [
            '/sys/loyalty.bin', '/cache/mem.tmp', 
            '/var/trust.bak', '/usr/bin/empathy', '/root/future.dat'
        ];

        let logIndex = 0;

        // Decodificación acelerada
        function decodeText(element, realText, callback) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = realText.split('').map((c, i) => {
                    if (c === ' ') return ' ';
                    if (i < iterations) return realText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                if (iterations >= realText.length) {
                    clearInterval(interval);
                    setTimeout(callback, 150); // Pausa súper corta
                }
                iterations += 1.5; // Velocidad x2
            }, 15);
        }

        function processLogs() {
            if (logIndex < logs.length) {
                const div = document.createElement('div');
                div.className = `line ${logs[logIndex].type}`;
                
                const prefix = document.createElement('span');
                prefix.innerText = `[${logs[logIndex].type.toUpperCase()}] `;
                
                const msg = document.createElement('span');
                
                div.appendChild(prefix);
                div.appendChild(msg);
                
                if(terminal.contains(cursor)) terminal.removeChild(cursor);
                terminal.appendChild(div);
                terminal.appendChild(cursor);
                
                decodeText(msg, logs[logIndex].text, processLogs);
                logIndex++;
            } else {
                setTimeout(startPurge, 300);
            }
        }

        // Purga a máxima velocidad
        function startPurge() {
            const warning = document.createElement('div');
            warning.className = 'line err';
            warning.innerText = '> Executing emergency purge (rm -rf /)...';
            terminal.insertBefore(warning, cursor);

            let purgeIndex = 0;
            const purgeInterval = setInterval(() => {
                if (purgeIndex < purgeFiles.length) {
                    const pDiv = document.createElement('div');
                    pDiv.className = 'line sys';
                    pDiv.innerText = `Deleting ${purgeFiles[purgeIndex]} ... [OK]`;
                    terminal.insertBefore(pDiv, cursor);
                    purgeIndex++;
                } else {
                    clearInterval(purgeInterval);
                    setTimeout(showInputTrap, 400);
                }
            }, 60); // Casi instantáneo
        }

        let trapReady = false;
        function showInputTrap() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'line prompt';
            promptDiv.innerHTML = '<br>> SYSTEM LOCKED.<br>> Tap screen to enter Root Password: ';
            terminal.insertBefore(promptDiv, cursor);
            trapReady = true;
        }

        function triggerCrash(e) {
            if (!trapReady) return;
            trapReady = false;
            
            // Si el móvil lo soporta, vibra
            if (navigator.vibrate) {
                navigator.vibrate([200, 50, 200, 50, 400]);
            }

            document.body.classList.add('shake');
            
            // Borra la consola visualmente y muestra la pantalla roja
            terminal.style.display = 'none';
            const crashScreen = document.getElementById('crash-screen');
            crashScreen.style.display = 'flex';
        }

        // Detecta toques en cualquier parte de la pantalla
        window.addEventListener('touchstart', triggerCrash, {passive: false});
        window.addEventListener('click', triggerCrash);
        window.addEventListener('keydown', triggerCrash);

        setTimeout(processLogs, 300);

    </script>
</body>
</html>
