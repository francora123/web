<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERR_CONNECTION_REFUSED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; user-select: none;
            touch-action: none;
            word-wrap: break-word;
        }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #terminal {
            position: relative; padding: 1.5rem; height: 100%;
            box-sizing: border-box; z-index: 1; 
            font-size: 17px;
            line-height: 1.5; text-shadow: 0 0 5px #0f0; overflow-y: hidden;
        }

        .line { margin-bottom: 6px; }
        .sys { color: #888; }
        .ok { color: #0f0; }
        .warn { color: #ff0; text-shadow: 0 0 5px #ff0; }
        .err { color: #f00; text-shadow: 0 0 5px #f00; }
        .prompt { color: #fff; text-shadow: 0 0 8px #fff; font-weight: bold; }

        .cursor { display: inline-block; width: 8px; height: 14px; background: #0f0; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        #crash-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000; color: #00ff00; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; text-shadow: 3px 3px 0 #000; padding: 20px; box-sizing: border-box;
            overflow: hidden;
        }
        
        #crash-screen h1 {
            font-size: 12vw; margin: 0; letter-spacing: 2px; line-height: 1; z-index: 10;
        }
        
        #crash-screen p {
            font-size: 5vw; margin-top: 15px; font-weight: bold; z-index: 10; color: #ffff00;
        }

        #flash-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #00ff00; z-index: 10000; pointer-events: none;
        }

        .color-invert-glitch {
            animation: glitch-invert 0.05s infinite, hard-shake 0.2s infinite;
        }

        @keyframes glitch-invert {
            0%, 49% { 
                background-color: #ff0000; 
                color: #00ff00; 
                -webkit-filter: invert(0) hue-rotate(0deg) contrast(300%); 
                filter: invert(0) hue-rotate(0deg) contrast(300%); 
            }
            50%, 100% { 
                background-color: #000000; 
                color: #ff00ff; 
                -webkit-filter: invert(1) hue-rotate(270deg) contrast(300%); 
                filter: invert(1) hue-rotate(270deg) contrast(300%); 
            }
        }

        @keyframes hard-shake {
            0% { transform: translate(6px, 6px) rotate(0deg); }
            20% { transform: translate(-6px, -3px) rotate(-2deg); }
            40% { transform: translate(-4px, 0px) rotate(2deg); }
            60% { transform: translate(4px, 3px) rotate(0deg); }
            80% { transform: translate(-2px, -2px) rotate(2deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }

        .bug {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.5));
            transition: left 0.4s linear, top 0.4s linear, transform 0.15s ease;
        }
    </style>
</head>
<body class="crt">

    <div id="terminal"></div>
    <div id="flash-overlay"></div>

    <div id="crash-screen">
        <h1>ACCESS DENIED</h1>
        <p>FATAL EXCEPTION // HOST DISCONNECTED</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>';

        const logs = [
            { type: 'sys', text: 'INIT: Bootstrapping host environment...' },
            { type: 'ok',  text: 'VFS_ALLOC: Local physical volumes mounted. (100%)' },
            { type: 'ok',  text: 'AUTH: Privileges escalated. Token -> [PERMANENT_RESIDENCY].' },
            { type: 'warn',text: 'SYS_TICK: Session TTL threshold reached (720h).' },
            { type: 'warn',text: 'NET_ROUTE: Traffic rerouted to untrusted external peer.' },
            { type: 'err', text: 'SEC_ALARM: SQL Injection detected in [trusted_nodes.db].' },
            { type: 'err', text: 'KERNEL_PANIC: Core failed. Dependencies missing in empath.so.' }
        ];

        const purgeFiles = [
            '/sys/loyalty.bin',
            '/var/trust.bak',
            '/usr/bin/empathy.so',
            '/root/future_plans.dat',
            '/usr/lib/patience_buffer.tmp',
            '/usr/sbin/shutdown_personal_server.service'
        ];

        let logIndex = 0;
        let audioCtx = null;

        function unlockAudio() {
            if (audioCtx && audioCtx.state !== 'suspended') return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { console.warn(e); }
        }
        
        window.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        window.addEventListener('click', unlockAudio, { once: true });
        window.addEventListener('keydown', unlockAudio, { once: true });

        function decodeText(element, realText, callback) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = realText.split('').map((c, i) => {
                    if (c === ' ') return ' ';
                    if (i < iterations) return realText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');

                if (iterations >= realText.length) {
                    clearInterval(interval);
                    setTimeout(callback, 150);
                }
                iterations += 1.5;
            }, 15);
        }

        function processLogs() {
            if (logIndex < logs.length) {
                const div = document.createElement('div');
                div.className = `line ${logs[logIndex].type}`;
                div.innerHTML = `<span>[${logs[logIndex].type.toUpperCase()}] </span><span></span>`;

                if (terminal.contains(cursor)) terminal.removeChild(cursor);
                terminal.appendChild(div);
                terminal.appendChild(cursor);

                decodeText(div.childNodes[1], logs[logIndex].text, processLogs);
                logIndex++;
            } else {
                setTimeout(startPurge, 300);
            }
        }

        function startPurge() {
            const warning = document.createElement('div');
            warning.className = 'line err';
            warning.innerText = '> Executing emergency purge (rm -rf /)...';
            terminal.insertBefore(warning, cursor);

            let purgeIndex = 0;
            const purgeInterval = setInterval(() => {
                if (purgeIndex < purgeFiles.length) {
                    const pDiv = document.createElement('div');
                    pDiv.className = 'line sys';
                    pDiv.innerText = `Deleting ${purgeFiles[purgeIndex]} ... [OK]`;
                    terminal.insertBefore(pDiv, cursor);
                    purgeIndex++;
                } else {
                    clearInterval(purgeInterval);
                    setTimeout(showInputTrap, 400);
                }
            }, 60);
        }

        let trapReady = false;
        function showInputTrap() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'line prompt';
            promptDiv.innerHTML = '<br>> SYSTEM LOCKED.<br>> Critical Error in module [RELATIONSHIP_MODULE].<br>> Tap screen to acknowledge wipe and disconnect forever: ';
            terminal.insertBefore(promptDiv, cursor);
            trapReady = true;
        }

        function playErrorSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const fire = () => {
                    const now = audioCtx.currentTime;
                    const masterGain = audioCtx.createGain();
                    masterGain.gain.setValueAtTime(4.0, now);
                    masterGain.connect(audioCtx.destination);

                    const osc1 = audioCtx.createOscillator();
                    osc1.type = 'square';
                    osc1.frequency.setValueAtTime(2500, now);

                    const osc2 = audioCtx.createOscillator();
                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(2650, now);

                    const lfo = audioCtx.createOscillator();
                    lfo.type = 'square';
                    lfo.frequency.setValueAtTime(15, now);

                    const lfoGain = audioCtx.createGain();
                    lfoGain.gain.setValueAtTime(1000, now);

                    lfo.connect(lfoGain);
                    lfoGain.connect(osc1.frequency);
                    lfoGain.connect(osc2.frequency);

                    osc1.connect(masterGain);
                    osc2.connect(masterGain);

                    osc1.start(now);
                    osc2.start(now);
                    lfo.start(now);
                };

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().then(fire);
                } else {
                    fire();
                }
            } catch (e) { console.error(e); }
        }

        function playVibration() {
            if (!navigator.vibrate) return;
            navigator.vibrate([300, 100, 300, 100, 500, 150, 200, 150, 700]);
        }

        function spawnBugs() {
            const bugTypes = ['🪱', '🕷️', '🐜', '🪱'];
            const crashScreen = document.getElementById('crash-screen');
            const numBugs = 45;

            for (let i = 0; i < numBugs; i++) {
                const bug = document.createElement('div');
                bug.className = 'bug';
                bug.innerText = bugTypes[Math.floor(Math.random() * bugTypes.length)];

                let x = Math.random() * window.innerWidth;
                let y = Math.random() * window.innerHeight;
                bug.style.left = x + 'px';
                bug.style.top = y + 'px';

                bug.style.fontSize = (Math.random() * 20 + 20) + 'px';
                crashScreen.appendChild(bug);

                setInterval(() => {
                    let nextX = x + (Math.random() - 0.5) * 200;
                    let nextY = y + (Math.random() - 0.5) * 200;

                    if (nextX < -20) nextX = window.innerWidth + 20;
                    if (nextX > window.innerWidth + 20) nextX = -20;
                    if (nextY < -20) nextY = window.innerHeight + 20;
                    if (nextY > window.innerHeight + 20) nextY = -20;

                    let angle = Math.atan2(nextY - y, nextX - x) * (180 / Math.PI) + 90;

                    bug.style.left = nextX + 'px';
                    bug.style.top = nextY + 'px';
                    bug.style.transform = `rotate(${angle}deg)`;

                    x = nextX;
                    y = nextY;
                }, Math.random() * 300 + 200);
            }
        }

        function triggerCrash(e) {
            if (!trapReady) return;
            trapReady = false;

            playVibration();
            playErrorSound();

            const flash = document.getElementById('flash-overlay');
            flash.style.display = 'block';
            
            setTimeout(() => { 
                flash.style.display = 'none'; 
                
                document.body.classList.add('color-invert-glitch');
                
                terminal.style.display = 'none';
                const crashScreen = document.getElementById('crash-screen');
                crashScreen.style.display = 'flex';
                
                spawnBugs();
            }, 100);
        }

        window.addEventListener('touchstart', triggerCrash, { passive: false });
        window.addEventListener('click', triggerCrash);
        window.addEventListener('keydown', triggerCrash);

        setTimeout(processLogs, 300);
    </script>
</body>
</html>
