<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - System Dump</title>
    <style>
        body {
            background: #0a0a0a;
            color: #1ed760;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            font-size: 14px;
        }
        #console {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        .line { margin-bottom: 10px; line-height: 1.4; }
        .error { color: #d43a4c; font-weight: bold; font-size: 16px; margin-top: 20px; }
        .cursor { display: inline-block; width: 8px; height: 15px; background: #1ed760; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .signature { position: fixed; bottom: 10px; right: 10px; font-size: 10px; color: #333; }
    </style>
</head>
<body>
    <div id="console"></div>
    <div class="signature">err_trace: cf_sys_dump</div>
    
    <script>
        const lines = [
            "> INITIALIZING CONNECTION...",
            "> REQUESTING MODULE: ALOJAMIENTO.SYS... [GRANTED]",
            "> PROCESSING: PAPELES_LEGALES (TIPO: PAREJA_DE_HECHO)... [APPROVED]",
            "> EXTRACTING RECURSOS Y TIEMPO... [100% COMPLETE]",
            "> CORRUPTING FILE: CIRCULO_SOCIAL.DAT... [SUCCESS]",
            "> SEARCHING NEW HOST...",
            "> NEW HOST DETECTED. INITIATING TRANSFER...",
            "> DISCONNECTING ORIGINAL HOST...",
            " ",
            "ERROR 404: EMPATÍA Y LEALTAD NOT FOUND.",
            "PROJECT TERMINATED."
        ];
        
        const consoleDiv = document.getElementById('console');
        let i = 0;
        
        function typeLine() {
            if (i < lines.length) {
                const lineDiv = document.createElement('div');
                lineDiv.className = (i >= lines.length - 2) ? 'line error' : 'line';
                lineDiv.innerText = lines[i];
                consoleDiv.appendChild(lineDiv);
                
                let delay = (i === 2 || i === 4) ? 1800 : 900; 
                i++;
                setTimeout(typeLine, delay);
            } else {
                const cursor = document.createElement('div');
                cursor.className = 'cursor';
                consoleDiv.appendChild(cursor);
            }
        }
        
        setTimeout(typeLine, 1000);
    </script>
</body>
</html>
