<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #fff;
            font-family: monospace;
            cursor: none; /* Oculta el cursor para que tú seas el punto blanco */
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 18px; font-weight: normal; color: #a0a0a0; }
        #bar-container {
            width: 200px;
            height: 10px;
            background: #222;
            margin-top: 10px;
            border: 1px solid #444;
        }
        #bar {
            width: 100%;
            height: 100%;
            background: #1ed760;
            transition: width 0.1s, background 0.3s;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
        #message h2 { color: #d43a4c; font-size: 32px; margin-bottom: 10px; }
        #message p { color: #888; }
        .signature {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: #222;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="status">Status: Hosting Client...</h1>
        <div id="bar-container"><div id="bar"></div></div>
    </div>

    <div id="message">
        <h2>404 NOT FOUND</h2>
        <p>Host resources depleted. Client disconnected and relocated.</p>
    </div>

    <canvas id="canvas"></canvas>
    
    <div class="signature">err_trace: cf_sys_drain</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const msg = document.getElementById('message');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let host = { x: canvas.width / 2, y: canvas.height / 2, r: 8, energy: 100 };
        let parasite = { x: -50, y: -50, r: 12, speed: 0.04 };
        let active = true;

        // Seguir al ratón o dedo
        window.addEventListener('mousemove', e => { host.x = e.clientX; host.y = e.clientY; });
        window.addEventListener('touchmove', e => { host.x = e.touches[0].clientX; host.y = e.touches[0].clientY; });

        function loop() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (active) {
                // El parásito persigue al host
                parasite.x += (host.x - parasite.x) * parasite.speed;
                parasite.y += (host.y - parasite.y) * parasite.speed;

                // Colisión (drenar energía)
                const dist = Math.hypot(host.x - parasite.x, host.y - parasite.y);
                if (dist < host.r + parasite.r) {
                    host.energy -= 0.5;
                    bar.style.width = Math.max(0, host.energy) + '%';
                    
                    if(host.energy < 50) bar.style.background = '#d43a4c';

                    if (host.energy <= 0) {
                        active = false; // Se acabó la energía
                        status.innerText = "Status: Connection Dropped";
                        msg.style.display = 'block';
                        document.body.style.cursor = 'auto'; // Devuelve el cursor
                    }
                }

                // Dibujar host (tú)
                ctx.beginPath();
                ctx.arc(host.x, host.y, host.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            } else {
                // El parásito huye al vaciarte
                parasite.x += 15; // Se va rápido a la derecha
                parasite.y -= 5;
            }

            // Dibujar parásito (ella)
            ctx.beginPath();
            ctx.arc(parasite.x, parasite.y, parasite.r + (100 - host.energy)*0.1, 0, Math.PI * 2);
            ctx.fillStyle = active ? '#d43a4c' : '#444'; // Se apaga cuando se va
            ctx.fill();

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
