<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body { 
            background-color: #f8f9fa; 
            color: #212529; 
            font-family: Arial, sans-serif; 
            padding: 50px; 
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { 
            font-size: 28px; 
            border-bottom: 1px solid #dee2e6; 
            padding-bottom: 15px; 
            font-weight: normal;
        }
        p { 
            font-size: 15px; 
            color: #495057; 
            margin-top: 20px; 
        }
        .signature { 
            font-family: monospace;
            font-size: 11px; 
            color: #adb5bd; 
            margin-top: 50px; 
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>404 Not Found</h1>
    <p>The requested resource could not be found on this server. Please check the URL or contact the server administrator.</p>
    <div class="signature">err_trace: cf_host_terminated</div>
</body>
</html>
