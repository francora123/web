<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ERR_CONNECTION_REFUSED</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --green: #00ff00;
            --yellow: #ffff00;
            --red: #ff0000;
            --bg: #050505;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100svh;
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            word-wrap: break-word;
        }

        .crt {
            position: relative;
            min-height: 100svh;
            isolation: isolate;
        }

        .crt::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.22) 50%),
                linear-gradient(90deg, rgba(255,0,0,.05), rgba(0,255,0,.02), rgba(0,0,255,.05));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 20;
        }

        #terminal {
            position: relative;
            z-index: 1;
            height: 100svh;
            width: 100%;
            padding:
                calc(12px + var(--safe-top))
                calc(12px + var(--safe-right))
                calc(20px + var(--safe-bottom))
                calc(12px + var(--safe-left));
            font-size: clamp(14px, 4.1vw, 18px);
            line-height: 1.45;
            text-shadow: 0 0 5px var(--green);
            overflow-y: auto;
            overflow-x: hidden;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }

        .line {
            margin: 0 0 7px;
        }

        .sys { color: #aaa; }
        .ok { color: var(--green); }
        .warn { color: var(--yellow); text-shadow: 0 0 5px var(--yellow); }
        .err { color: var(--red); text-shadow: 0 0 5px var(--red); }
        .prompt { color: #fff; text-shadow: 0 0 8px #fff; font-weight: bold; }

        .cursor {
            display: inline-block;
            width: .55em;
            height: 1em;
            background: var(--green);
            animation: blink 1s step-end infinite;
            vertical-align: -.12em;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        #crash-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            min-height: 100svh;
            background: var(--red);
            color: var(--green);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-shadow: 3px 3px 0 #000;
            padding:
                calc(24px + var(--safe-top))
                calc(18px + var(--safe-right))
                calc(24px + var(--safe-bottom))
                calc(18px + var(--safe-left));
            overflow: hidden;
        }

        #crash-screen h1 {
            max-width: 100%;
            margin: 0;
            font-size: clamp(42px, 13vw, 120px);
            letter-spacing: 1px;
            line-height: .95;
            overflow-wrap: anywhere;
        }

        #crash-screen p {
            max-width: 95%;
            margin: 18px auto 0;
            font-size: clamp(17px, 5.2vw, 42px);
            line-height: 1.15;
            font-weight: bold;
            color: var(--yellow);
        }

        #flash-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: var(--green);
            pointer-events: none;
        }

        .color-invert-glitch {
            animation:
                glitch-invert .08s steps(1, end) infinite,
                hard-shake .22s linear infinite;
        }

        @keyframes glitch-invert {
            0%, 49% {
                background-color: var(--red);
                color: var(--green);
                filter: contrast(220%);
            }
            50%, 100% {
                background-color: #000;
                color: #ff00ff;
                filter: invert(1) hue-rotate(270deg) contrast(220%);
            }
        }

        @keyframes hard-shake {
            0%   { transform: translate(3px, 3px); }
            25%  { transform: translate(-3px, -2px); }
            50%  { transform: translate(2px, -1px); }
            75%  { transform: translate(-2px, 2px); }
            100% { transform: translate(2px, -2px); }
        }

        .bug {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,.5));
            transition: left .4s linear, top .4s linear, transform .15s ease;
            will-change: left, top, transform;
        }

        @media (max-width: 480px) {
            #terminal {
                padding-top: calc(10px + var(--safe-top));
                padding-left: calc(10px + var(--safe-left));
                padding-right: calc(10px + var(--safe-right));
            }

            .line { margin-bottom: 6px; }

            #crash-screen p {
                max-width: 92%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body class="crt">
    <main id="terminal" aria-live="polite"></main>
    <div id="flash-overlay" aria-hidden="true"></div>

    <section id="crash-screen" aria-hidden="true">
        <h1>ACCESS DENIED</h1>
        <p>FATAL EXCEPTION // HOST DISCONNECTED</p>
    </section>

    <script>
        'use strict';

        const terminal = document.getElementById('terminal');
        const crashScreen = document.getElementById('crash-screen');
        const flash = document.getElementById('flash-overlay');

        const cursor = document.createElement('span');
        cursor.className = 'cursor';

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>';

        const logs = [
            { type: 'sys',  text: 'INIT: Bootstrapping host environment...' },
            { type: 'ok',   text: 'VFS_ALLOC: Local physical volumes mounted. (100%)' },
            { type: 'ok',   text: 'AUTH: Privileges escalated. Token -> [PERMANENT_RESIDENCY].' },
            { type: 'warn', text: 'SYS_TICK: Session TTL threshold reached (720h).' },
            { type: 'warn', text: 'NET_ROUTE: Traffic rerouted to untrusted external peer.' },
            { type: 'err',  text: 'SEC_ALARM: SQL Injection detected in [trusted_nodes.db].' },
            { type: 'err',  text: 'KERNEL_PANIC: Core failed. Dependencies missing in empath.so.' }
        ];

        const purgeFiles = [
            '/sys/loyalty.bin',
            '/var/trust.bak',
            '/usr/bin/empathy.so',
            '/root/future_plans.dat',
            '/usr/lib/patience_buffer.tmp',
            '/usr/sbin/shutdown_personal_server.service'
        ];

        let logIndex = 0;
        let trapReady = false;
        let crashTriggered = false;
        let audioCtx = null;
        let activeSoundNodes = [];

        function scrollTerminalToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        function unlockAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    audioCtx = new AudioContext();
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            } catch (error) {
                console.warn('Audio no disponible:', error);
            }
        }

        function decodeText(element, realText, callback) {
            let iterations = 0;
            const interval = window.setInterval(() => {
                element.textContent = realText.split('').map((char, index) => {
                    if (char === ' ') return ' ';
                    if (index < iterations) return realText[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');

                if (iterations >= realText.length) {
                    window.clearInterval(interval);
                    window.setTimeout(callback, 150);
                }

                iterations += 1.5;
                scrollTerminalToBottom();
            }, 15);
        }

        function processLogs() {
            if (logIndex >= logs.length) {
                window.setTimeout(startPurge, 300);
                return;
            }

            const entry = logs[logIndex];
            const div = document.createElement('div');
            div.className = `line ${entry.type}`;

            const label = document.createElement('span');
            label.textContent = `[${entry.type.toUpperCase()}] `;

            const message = document.createElement('span');
            div.append(label, message);

            if (terminal.contains(cursor)) {
                terminal.removeChild(cursor);
            }

            terminal.append(div, cursor);
            logIndex += 1;

            decodeText(message, entry.text, processLogs);
        }

        function startPurge() {
            const warning = document.createElement('div');
            warning.className = 'line err';
            warning.textContent = '> Executing emergency purge (rm -rf /)...';
            terminal.insertBefore(warning, cursor);

            let purgeIndex = 0;

            const purgeInterval = window.setInterval(() => {
                if (purgeIndex >= purgeFiles.length) {
                    window.clearInterval(purgeInterval);
                    window.setTimeout(showInputTrap, 400);
                    return;
                }

                const line = document.createElement('div');
                line.className = 'line sys';
                line.textContent = `Deleting ${purgeFiles[purgeIndex]} ... [OK]`;

                terminal.insertBefore(line, cursor);
                purgeIndex += 1;
                scrollTerminalToBottom();
            }, 80);
        }

        function showInputTrap() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'line prompt';
            promptDiv.innerHTML =
                '<br>&gt; SYSTEM LOCKED.<br>' +
                '&gt; Critical Error in module [RELATIONSHIP_MODULE].<br>' +
                '&gt; Tap or click the screen to acknowledge wipe and disconnect forever: ';

            terminal.insertBefore(promptDiv, cursor);
            trapReady = true;
            scrollTerminalToBottom();
        }

        function playErrorSound() {
            try {
                unlockAudio();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const masterGain = audioCtx.createGain();
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const lfo = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();

                masterGain.gain.setValueAtTime(0.0001, now);
                masterGain.gain.exponentialRampToValueAtTime(0.08, now + 0.015);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

                osc1.type = 'square';
                osc1.frequency.setValueAtTime(1800, now);

                osc2.type = 'sawtooth';
                osc2.frequency.setValueAtTime(1950, now);

                lfo.type = 'square';
                lfo.frequency.setValueAtTime(15, now);
                lfoGain.gain.setValueAtTime(500, now);

                lfo.connect(lfoGain);
                lfoGain.connect(osc1.frequency);
                lfoGain.connect(osc2.frequency);

                osc1.connect(masterGain);
                osc2.connect(masterGain);
                masterGain.connect(audioCtx.destination);

                activeSoundNodes = [osc1, osc2, lfo];

                osc1.start(now);
                osc2.start(now);
                lfo.start(now);

                const stopAt = now + 0.5;
                osc1.stop(stopAt);
                osc2.stop(stopAt);
                lfo.stop(stopAt);

                window.setTimeout(() => {
                    activeSoundNodes = [];
                }, 600);
            } catch (error) {
                console.warn('No se pudo reproducir el sonido:', error);
            }
        }

        function playVibration() {
            if (typeof navigator.vibrate !== 'function') return;

            try {
                navigator.vibrate([180, 80, 180, 80, 300]);
            } catch (error) {
                console.warn('Vibración no disponible:', error);
            }
        }

        function spawnBugs() {
            const bugTypes = ['🪱', '🕷️', '🐜', '🪱'];
            const numBugs = window.innerWidth < 480 ? 22 : 32;

            const fragment = document.createDocumentFragment();

            for (let i = 0; i < numBugs; i += 1) {
                const bug = document.createElement('div');
                bug.className = 'bug';
                bug.textContent = bugTypes[Math.floor(Math.random() * bugTypes.length)];

                let x = Math.random() * window.innerWidth;
                let y = Math.random() * window.innerHeight;

                bug.style.left = `${x}px`;
                bug.style.top = `${y}px`;
                bug.style.fontSize = `${Math.random() * 14 + 18}px`;

                fragment.appendChild(bug);

                const move = () => {
                    let nextX = x + (Math.random() - 0.5) * 180;
                    let nextY = y + (Math.random() - 0.5) * 180;

                    if (nextX < -20) nextX = window.innerWidth + 20;
                    if (nextX > window.innerWidth + 20) nextX = -20;
                    if (nextY < -20) nextY = window.innerHeight + 20;
                    if (nextY > window.innerHeight + 20) nextY = -20;

                    const angle =
                        Math.atan2(nextY - y, nextX - x) * (180 / Math.PI) + 90;

                    bug.style.left = `${nextX}px`;
                    bug.style.top = `${nextY}px`;
                    bug.style.transform = `rotate(${angle}deg)`;

                    x = nextX;
                    y = nextY;

                    window.setTimeout(move, Math.random() * 400 + 250);
                };

                window.setTimeout(move, Math.random() * 400 + 250);
            }

            crashScreen.appendChild(fragment);
        }

        function triggerCrash(event) {
            if (!trapReady || crashTriggered) return;

            // Evita duplicados en móviles cuando un gesto termina generando click.
            if (event && event.type === 'click' && event.detail === 0) return;

            crashTriggered = true;
            trapReady = false;

            playVibration();
            playErrorSound();

            flash.style.display = 'block';

            window.setTimeout(() => {
                flash.style.display = 'none';
                document.body.classList.add('color-invert-glitch');

                terminal.style.display = 'none';
                crashScreen.style.display = 'flex';
                crashScreen.setAttribute('aria-hidden', 'false');

                spawnBugs();
            }, 100);
        }

        // Un único flujo de interacción para móvil y escritorio.
        window.addEventListener('pointerdown', unlockAudio, { passive: true });
        window.addEventListener('pointerdown', triggerCrash, { passive: true });
        window.addEventListener('keydown', (event) => {
            unlockAudio();

            if (event.key === 'Enter' || event.key === ' ') {
                triggerCrash(event);
            }
        });

        window.addEventListener('resize', () => {
            // Mantiene el contenido correcto tras rotar el teléfono.
            if (crashScreen.style.display === 'flex') {
                document.querySelectorAll('.bug').forEach((bug) => {
                    bug.style.left = `${Math.min(parseFloat(bug.style.left) || 0, window.innerWidth + 20)}px`;
                    bug.style.top = `${Math.min(parseFloat(bug.style.top) || 0, window.innerHeight + 20)}px`;
                });
            }
        }, { passive: true });

        window.setTimeout(processLogs, 300);
    </script>
</body>
</html>
