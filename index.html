<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ERR_CONNECTION_REFUSED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; user-select: none;
        }

        /* CRT Effect */
        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #terminal {
            position: relative; padding: 2rem; height: 100%;
            box-sizing: border-box; z-index: 1; font-size: 14px;
            line-height: 1.6; text-shadow: 0 0 5px #0f0; overflow-y: hidden;
        }

        .line { margin-bottom: 5px; }
        .sys { color: #888; }
        .ok { color: #0f0; }
        .warn { color: #ff0; text-shadow: 0 0 5px #ff0; }
        .err { color: #f00; text-shadow: 0 0 5px #f00; }
        
        .cursor { display: inline-block; width: 8px; height: 15px; background: #0f0; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Fullscreen Red Crash */
        #crash-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #d40000; color: #fff; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
            text-shadow: 2px 2px 0 #000;
        }
        #crash-screen h1 { font-size: 3rem; margin: 0; letter-spacing: 5px; }
        #crash-screen p { font-size: 1.2rem; }

        /* Shake animation */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body class="crt">

    <div id="terminal"></div>

    <div id="crash-screen">
        <h1>ACCESS DENIED</h1>
        <p>FATAL EXCEPTION // HOST DISCONNECTED</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>';
        
        const logs = [
            { type: 'sys', text: 'INIT: Bootstrapping host environment...' },
            { type: 'ok',  text: 'VFS_ALLOC: Local physical volumes mounted. (100%)' },
            { type: 'ok',  text: 'AUTH: Privileges escalated. Token upgraded to [PERMANENT_RESIDENCY].' },
            { type: 'warn',text: 'SYS_TICK: Session TTL threshold reached (720h). Connection unstable.' },
            { type: 'warn',text: 'NET_ROUTE: Outbound traffic rerouted to untrusted external peer.' },
            { type: 'err', text: 'SEC_ALARM: SQL Injection detected in subnet [trusted_nodes.db].' },
            { type: 'err', text: 'KERNEL_PANIC: Core integrity failed. Dependencies missing in empath.so.' }
        ];

        const purgeFiles = [
            '/sys/loyalty/module.bin', '/cache/shared_mem.tmp', 
            '/var/trust_nodes.bak', '/usr/bin/empathy_daemon', '/root/future_plans.dat'
        ];

        let logIndex = 0;

        // 1. Efecto de decodificación de texto
        function decodeText(element, realText, callback) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = realText.split('').map((c, i) => {
                    if (c === ' ') return ' ';
                    if (i < iterations) return realText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                if (iterations >= realText.length) {
                    clearInterval(interval);
                    setTimeout(callback, 800); // Pausa antes de la siguiente línea
                }
                iterations += 1/2; // Velocidad de decodificación
            }, 25);
        }

        // Ejecutar los logs iniciales
        function processLogs() {
            if (logIndex < logs.length) {
                const div = document.createElement('div');
                div.className = `line ${logs[logIndex].type}`;
                
                const prefix = document.createElement('span');
                prefix.innerText = `[${logs[logIndex].type.toUpperCase()}] `;
                
                const msg = document.createElement('span');
                
                div.appendChild(prefix);
                div.appendChild(msg);
                
                if(terminal.contains(cursor)) terminal.removeChild(cursor);
                terminal.appendChild(div);
                terminal.appendChild(cursor);
                
                decodeText(msg, logs[logIndex].text, processLogs);
                logIndex++;
            } else {
                setTimeout(startPurge, 1000);
            }
        }

        // 2. Efecto de borrado masivo (rm -rf)
        function startPurge() {
            const warning = document.createElement('div');
            warning.className = 'line err';
            warning.innerText = '> Executing emergency purge (rm -rf /)...';
            terminal.insertBefore(warning, cursor);

            let purgeIndex = 0;
            const purgeInterval = setInterval(() => {
                if (purgeIndex < purgeFiles.length) {
                    const pDiv = document.createElement('div');
                    pDiv.className = 'line sys';
                    pDiv.innerText = `Deleting ${purgeFiles[purgeIndex]} ... [OK]`;
                    terminal.insertBefore(pDiv, cursor);
                    purgeIndex++;
                } else {
                    clearInterval(purgeInterval);
                    setTimeout(showInputTrap, 1000);
                }
            }, 150); // Muy rápido
        }

        // 3. Trampa de Input
        let trapReady = false;
        function showInputTrap() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'line ok';
            promptDiv.innerHTML = '<br>> SYSTEM LOCKED. RECONNECTION ATTEMPT.<br>> Enter Root Password: ';
            terminal.insertBefore(promptDiv, cursor);
            trapReady = true;
        }

        // 4. Pantallazo Rojo y Vibración
        function triggerCrash() {
            if (!trapReady) return;
            trapReady = false; // Evitar que se ejecute dos veces

            // Vibración (funciona en Android)
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200, 100, 500]);
            }

            // CSS Shake
            document.body.classList.add('shake');

            // Pantallazo rojo
            const crashScreen = document.getElementById('crash-screen');
            crashScreen.style.display = 'flex';
        }

        // Escuchar toques en la pantalla o teclas
        window.addEventListener('keydown', triggerCrash);
        window.addEventListener('touchstart', triggerCrash);
        window.addEventListener('click', triggerCrash);

        // Iniciar secuencia al cargar
        setTimeout(processLogs, 500);

    </script>
</body>
</html>
