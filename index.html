<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Not Found</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0b;
            color: #fff;
            font-family: monospace;
            touch-action: none; /* Bloquea el scroll al jugar en móvil */
            overscroll-behavior: none;
            cursor: none;
        }
        #ui {
            position: absolute;
            top: 25px;
            left: 20px;
            right: 20px;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 16px; font-weight: normal; color: #a0a0a0; }
        #bar-container {
            width: 100%;
            max-width: 300px;
            height: 12px;
            background: #222;
            margin-top: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
        }
        #bar {
            width: 100%;
            height: 100%;
            background: #1ed760;
            transition: width 0.1s, background 0.3s;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            width: 90%;
        }
        #message h2 { color: #d43a4c; font-size: 28px; margin-bottom: 10px; }
        #message p { color: #888; font-size: 14px; line-height: 1.5; }
        .signature {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: #222;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h1 id="status">Status: Hosting Client...</h1>
        <div id="bar-container"><div id="bar"></div></div>
    </div>

    <div id="message">
        <h2>404 NOT FOUND</h2>
        <p>Host resources depleted.<br>Client disconnected and relocated.</p>
    </div>

    <canvas id="canvas"></canvas>
    
    <div class="signature">err_trace: cf_sys_drain</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');
        const msg = document.getElementById('message');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let host = { x: canvas.width / 2, y: canvas.height / 1.5, r: 10, energy: 100 };
        let parasite = { x: -50, y: -50, r: 14, speed: 0.045 };
        let active = true;

        // Controles adaptados para móvil y PC
        function moveHost(e) {
            if(!active) return;
            host.x = e.clientX || (e.touches && e.touches[0].clientX);
            host.y = e.clientY || (e.touches && e.touches[0].clientY);
        }

        window.addEventListener('mousemove', moveHost);
        window.addEventListener('touchstart', e => { e.preventDefault(); moveHost(e); }, {passive: false});
        window.addEventListener('touchmove', e => { e.preventDefault(); moveHost(e); }, {passive: false});

        function loop() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (active) {
                // Persecución
                parasite.x += (host.x - parasite.x) * parasite.speed;
                parasite.y += (host.y - parasite.y) * parasite.speed;

                // Drenaje de energía
                const dist = Math.hypot(host.x - parasite.x, host.y - parasite.y);
                if (dist < host.r + parasite.r) {
                    host.energy -= 0.6; // Velocidad de desgaste
                    bar.style.width = Math.max(0, host.energy) + '%';
                    
                    if(host.energy < 40) bar.style.background = '#d43a4c';

                    if (host.energy <= 0) {
                        active = false;
                        status.innerText = "Status: Connection Dropped";
                        msg.style.display = 'block';
                        document.body.style.cursor = 'auto';
                    }
                }

                // Dibujar Host (Tú)
                ctx.beginPath();
                ctx.arc(host.x, host.y, host.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            } else {
                // El parásito abandona la pantalla rápido
                parasite.x += 12;
                parasite.y -= 12;
            }

            // Dibujar Parásito (Ella) - Crece ligeramente a medida que te vacía
            ctx.beginPath();
            ctx.arc(parasite.x, parasite.y, parasite.r + (100 - host.energy) * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = active ? '#d43a4c' : '#333'; 
            ctx.fill();

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
