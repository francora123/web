<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERR_CONNECTION_REFUSED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050505; color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden; user-select: none;
            touch-action: none;
            word-wrap: break-word;
        }

        .crt::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #terminal {
            position: relative; padding: 1.5rem; height: 100%;
            box-sizing: border-box; z-index: 1; font-size: 13px;
            line-height: 1.5; text-shadow: 0 0 5px #0f0; overflow-y: hidden;
        }

        .line { margin-bottom: 6px; }
        .sys { color: #888; }
        .ok { color: #0f0; }
        .warn { color: #ff0; text-shadow: 0 0 5px #ff0; }
        .err { color: #f00; text-shadow: 0 0 5px #f00; }
        .prompt { color: #fff; text-shadow: 0 0 8px #fff; font-weight: bold; }
        
        .cursor { display: inline-block; width: 8px; height: 14px; background: #0f0; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Pantallazo Rojo Orgánico y Asqueroso */
        #crash-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #8b0000 0%, #300000 70%, #1a0000 100%);
            color: #ffcccc; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; text-shadow: 3px 3px 0 #000; padding: 20px; box-sizing: border-box;
            overflow: hidden;
            animation: flash-strobe 0.15s infinite; /* Efecto estroboscópico de susto al entrar */
        }

        @keyframes flash-strobe {
            0% { filter: brightness(1); }
            50% { filter: brightness(2.2) contrast(2); background-color: #ff0000; }
            100% { filter: brightness(1); }
        }

        #crash-screen h1 { 
            font-size: 11vw; margin: 0; letter-spacing: 2px; line-height: 1; z-index: 10; color: #fff;
            animation: pulse-text 0.4s infinite alternate;
        }
        @keyframes pulse-text {
            0% { transform: scale(1); }
            100% { transform: scale(1.06); }
        }

        #crash-screen p { 
            font-size: 4.5vw; margin-top: 15px; font-weight: bold; z-index: 10; color: #ff9999;
        }

        /* Gusanos blandos con animación orgánica */
        .worm {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(2px 3px 5px rgba(0,0,0,0.9));
            animation: squirm 1.2s infinite alternate ease-in-out; 
            transition: left 0.6s ease-in-out, top 0.6s ease-in-out, transform 0.3s ease;
        }

        @keyframes squirm {
            0% { transform: scaleX(1) scaleY(1) rotate(var(--rot)); }
            50% { transform: scaleX(1.4) scaleY(0.6) rotate(var(--rot)); }
            100% { transform: scaleX(0.8) scaleY(1.2) rotate(var(--rot)); }
        }

        .shake-hard { animation: shake-hard 0.15s infinite; }
        @keyframes shake-hard {
            0% { transform: translate(6px, 6px) rotate(0deg); }
            20% { transform: translate(-6px, -4px) rotate(-2deg); }
            40% { transform: translate(-4px, 2px) rotate(2deg); }
            60% { transform: translate(4px, -2px) rotate(0deg); }
            80% { transform: translate(-2px, 4px) rotate(-1deg); }
            100% { transform: translate(2px, -4px) rotate(1deg); }
        }
    </style>
</head>
<body class="crt">

    <div id="terminal"></div>

    <div id="crash-screen">
        <h1>INFESTATION</h1>
        <p>SYSTEM CORRUPTION // HOST ROTTEN</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>';
        
        const logs = [
            { type: 'sys', text: 'INIT: Bootstrapping host environment...' },
            { type: 'ok',  text: 'VFS_ALLOC: Local physical volumes mounted. (100%)' },
            { type: 'ok',  text: 'AUTH: Privileges escalated. Token -> [PERMANENT_RESIDENCY].' },
            { type: 'warn',text: 'SYS_TICK: Session TTL threshold reached (720h).' },
            { type: 'warn',text: 'NET_ROUTE: Traffic rerouted to untrusted external peer.' },
            { type: 'err', text: 'SEC_ALARM: SQL Injection detected in [trusted_nodes.db].' },
            { type: 'err', text: 'KERNEL_PANIC: Core failed. Dependencies missing in empath.so.' }
        ];

        const purgeFiles = [
            '/sys/loyalty.bin', '/cache/mem.tmp', 
            '/var/trust.bak', '/usr/bin/empathy', '/root/future.dat'
        ];

        let logIndex = 0;

        function decodeText(element, realText, callback) {
            let iterations = 0;
            const interval = setInterval(() => {
                element.innerText = realText.split('').map((c, i) => {
                    if (c === ' ') return ' ';
                    if (i < iterations) return realText[i];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join('');
                
                if (iterations >= realText.length) {
                    clearInterval(interval);
                    setTimeout(callback, 150);
                }
                iterations += 1.5;
            }, 15);
        }

        function processLogs() {
            if (logIndex < logs.length) {
                const div = document.createElement('div');
                div.className = `line ${logs[logIndex].type}`;
                div.innerHTML = `<span>[${logs[logIndex].type.toUpperCase()}] </span><span></span>`;
                
                if(terminal.contains(cursor)) terminal.removeChild(cursor);
                terminal.appendChild(div);
                terminal.appendChild(cursor);
                
                decodeText(div.childNodes[1], logs[logIndex].text, processLogs);
                logIndex++;
            } else {
                setTimeout(startPurge, 300);
            }
        }

        function startPurge() {
            const warning = document.createElement('div');
            warning.className = 'line err';
            warning.innerText = '> Executing emergency purge (rm -rf /)...';
            terminal.insertBefore(warning, cursor);

            let purgeIndex = 0;
            const purgeInterval = setInterval(() => {
                if (purgeIndex < purgeFiles.length) {
                    const pDiv = document.createElement('div');
                    pDiv.className = 'line sys';
                    pDiv.innerText = `Deleting ${purgeFiles[purgeIndex]} ... [OK]`;
                    terminal.insertBefore(pDiv, cursor);
                    purgeIndex++;
                } else {
                    clearInterval(purgeInterval);
                    setTimeout(showInputTrap, 400);
                }
            }, 60);
        }

        let trapReady = false;
        function showInputTrap() {
            const promptDiv = document.createElement('div');
            promptDiv.className = 'line prompt';
            promptDiv.innerHTML = '<br>> SYSTEM LOCKED.<br>> Tap screen to enter Root Password: ';
            terminal.insertBefore(promptDiv, cursor);
            trapReady = true;
        }

        function playErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sawtooth'; 
                oscillator.frequency.setValueAtTime(100, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.5);

                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.8);
            } catch (e) {}
        }

        function spawnWorms() {
            const wormTypes = ['🪱', '🐛', '🦠', '🪱', '🧬']; 
            const crashScreen = document.getElementById('crash-screen');
            const numWorms = 65; // Más masa de bichos

            for (let i = 0; i < numWorms; i++) {
                const worm = document.createElement('div');
                worm.className = 'worm';
                worm.innerText = wormTypes[Math.floor(Math.random() * wormTypes.length)];
                
                let x = Math.random() * window.innerWidth;
                let y = Math.random() * window.innerHeight;
                worm.style.left = x + 'px';
                worm.style.top = y + 'px';
                
                worm.style.fontSize = (Math.random() * 30 + 25) + 'px';
                
                let angle = Math.random() * 360;
                worm.style.setProperty('--rot', `${angle}deg`);

                crashScreen.appendChild(worm);

                setInterval(() => {
                    let nextX = x + (Math.random() - 0.5) * 60;
                    let nextY = y + (Math.random() - 0.5) * 60;
                    
                    if(nextX < -50) nextX = window.innerWidth + 50;
                    if(nextX > window.innerWidth + 50) nextX = -50;
                    if(nextY < -50) nextY = window.innerHeight + 50;
                    if(nextY > window.innerHeight + 50) nextY = -50;

                    let newAngle = Math.atan2(nextY - y, nextX - x) * (180 / Math.PI) + 90;
                    
                    worm.style.left = nextX + 'px';
                    worm.style.top = nextY + 'px';
                    worm.style.setProperty('--rot', `${newAngle}deg`);
                    
                    x = nextX;
                    y = nextY;
                }, Math.random() * 700 + 400);
            }
        }

        function triggerCrash(e) {
            if (!trapReady) return;
            trapReady = false;
            
            // Vibración larga y seca de alerta
            if (navigator.vibrate) navigator.vibrate([500, 100, 500, 100, 800]);
            playErrorSound();

            document.body.classList.add('shake-hard');
            terminal.style.display = 'none';
            const crashScreen = document.getElementById('crash-screen');
            crashScreen.style.display = 'flex';

            // Quitar el parpadeo estroboscópico fuerte a los 2 segundos para que no moleste de más, dejando solo los gusanos y el temblor
            setTimeout(() => {
                crashScreen.style.animation = 'none';
            }, 2000);

            spawnWorms();
        }

        window.addEventListener('touchstart', triggerCrash, {passive: false});
        window.addEventListener('click', triggerCrash);
        window.addEventListener('keydown', triggerCrash);

        setTimeout(processLogs, 300);

    </script>
</body>
</html>
