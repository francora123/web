<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Proyecto Descontinuado</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .terminal {
            border-left: 3px solid #1ed760;
            padding-left: 20px;
            max-width: 600px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 1rem;
            line-height: 1.6;
            margin: 0;
            color: #8a8a8a;
        }
        .blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>> Error 404: Proyecto descontinuado_</h1>
        <p>El soporte técnico y el hosting para este dominio han finalizado.</p>
        <p>Los recursos del servidor han sido reasignados a desarrollos más rentables<span class="blink">.</span></p>
    </div>
</body>
</html>
